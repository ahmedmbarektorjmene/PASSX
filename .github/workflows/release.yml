name: Release

on:
  push:
    tags:
      - "release/v*.*.*"
      - "canary/v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build Release
        run: cargo build --release

      - name: Sign Executable (Ed25519)
        run: .\scripts\sign_executable.ps1 "target\release\passx.exe"
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}

      - name: Create Portable Archive
        run: Compress-Archive -Path "target\release\passx.exe" -DestinationPath "target\release\passx-portable-x64.zip"

      - name: Setup Certificate
        run: |
          $certDir = Join-Path $env:runner_temp "certs"
          New-Item -ItemType Directory -Force -Path $certDir | Out-Null
          $pfxPath = Join-Path $certDir "signing_cert.pfx"

          $certPassStr = if ($env:CERT_PASSWORD) { $env:CERT_PASSWORD } else { "" }
          $password = ConvertTo-SecureString -String $certPassStr -Force -AsPlainText

          if ($env:SIGNING_CERT) {
              Write-Host "Using provided SIGNING_CERT secret..."
              $bytes = [System.Convert]::FromBase64String($env:SIGNING_CERT)
              [System.IO.File]::WriteAllBytes($pfxPath, $bytes)
          } else {
              Write-Host "No SIGNING_CERT secret found. Generating Self-Signed Certificate..."
              $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=PassX Self-Signed" -CertStoreLocation "Cert:\CurrentUser\My"
              Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password
          }

          # Import to User Store just in case
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $password

          echo "PFX_PATH=$pfxPath" >> $env:GITHUB_ENV
        env:
          SIGNING_CERT: ${{ secrets.SIGNING_CERT }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Create MSI Installer
        run: cargo wix --no-build --nocapture

      - name: Sign MSI
        run: |
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
              Write-Error "Signtool not found!"
              exit 1
          }
          Write-Host "Using Signtool: $signtool"

          $certPassStr = if ($env:CERT_PASSWORD) { $env:CERT_PASSWORD } else { "" }

          $files = Get-ChildItem "target\wix\*.msi"
          foreach ($file in $files) {
              Write-Host "Signing $($file.FullName)..."
              & $signtool sign /f $env:PFX_PATH /p $certPassStr /tr http://timestamp.digicert.com /td sha256 /fd sha256 $file.FullName
          }
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            target/wix/*.msi
            target/release/passx-portable-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
